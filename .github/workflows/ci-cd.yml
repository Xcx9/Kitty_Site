name: CI/CD — КотоСайт

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  IMAGE_NAME: kotosite-web
  NGINX_IMAGE_NAME: kotosite-nginx

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Линтинг (проверка стиля кода)
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: catdjango/requirements.txt

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 catdjango/ \
            --max-line-length=120 \
            --exclude=catdjango/main/migrations,catdjango/staticfiles,catdjango/catdjango/__pycache__ \
            --count --statistics

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Тесты (Django test suite)
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: catdjango_test
          POSTGRES_USER: catdjango
          POSTGRES_PASSWORD: catdjango_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: django-insecure-ci-test-key
      DEBUG: "True"
      DB_HOST: localhost
      DB_PORT: 5432
      POSTGRES_DB: catdjango_test
      POSTGRES_USER: catdjango
      POSTGRES_PASSWORD: catdjango_pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: catdjango/requirements.txt

      - name: Install dependencies
        run: pip install -r catdjango/requirements.txt

      - name: Run Django tests
        working-directory: catdjango
        run: python manage.py test main --verbosity=2

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Сборка Docker-образов (без публикации)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: ./catdjango
          file: ./catdjango/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: false
          tags: ${{ env.NGINX_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Публикация в Docker Hub (только при пуше в main/master)
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Публикация web образа
      - name: Extract metadata for web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Push web image
        uses: docker/build-push-action@v5
        with:
          context: ./catdjango
          file: ./catdjango/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Публикация nginx образа
      - name: Extract metadata for nginx
        id: meta-nginx
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.NGINX_IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Push nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: ${{ steps.meta-nginx.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5: Деплой на Yandex Cloud
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Yandex Cloud
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.YC_HOST }}
          username: ${{ secrets.YC_USER }}
          key: ${{ secrets.YC_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e
            docker compose pull
            docker compose up -d
            docker compose exec web python manage.py migrate --noinput
            docker system prune -af
