{% extends 'main/base.html' %}
{% load static %}

{% block title %}Страница не найдена{% endblock %}

{% block content %}
<div class="not-found-container">
  <div class="not-found-box">
    <h1 class="not-found-code">404</h1>
    <h2 class="not-found-title">Мы не знаем такой страницы</h2>
    <p class="not-found-text">Кажется, эта страница потерялась...</p>
    <img
      src="{% static 'main/Not_found_kitty.jpg' %}"
      alt="Потерявшийся кот"
      class="not-found-img"
    >
    <a href="{% url 'home' %}" class="btn-home">Вернуться на главную</a>
  </div>
</div>
{% endblock %}
