version: '3.9'

services:

  # ── Микросервис 1: База данных ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: kotosite_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catdjango}
      POSTGRES_USER: ${POSTGRES_USER:-catdjango}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catdjango_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catdjango}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Микросервис 2: Django Web-приложение ────────────────────────────────────
  web:
    build:
      context: ./catdjango
      dockerfile: Dockerfile
    container_name: kotosite_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-me-in-production}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-catdjango}
      POSTGRES_USER: ${POSTGRES_USER:-catdjango}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catdjango_pass}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    expose:
      - "8000"

  # ── Микросервис 3: Nginx (обратный прокси + статика) ───────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: kotosite_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro

volumes:
  postgres_data:
  static_volume:
  media_volume:
